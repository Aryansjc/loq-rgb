[package]
name = "loq-rgb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "RGB keyboard lighting controller for Lenovo LOQ / Legion 4-zone ITE keyboards on Linux (GUI + CLI)"
repository = "https://github.com/Aryansjc/loq-rgb"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.36.2"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "loq-rgb"
path = "src/bin/loq-rgb.rs"

[[bin]]
name = "loq-rgb-cli"
path = "src/bin/loq-rgb-cli.rs"
